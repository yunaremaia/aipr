name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; the deploy-docs job widens it to what Pages
# actually needs (write on pages, OIDC token for the attestation).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same pinned-major ruff as the local dev install, so the gate cannot pass
      # here and fail on a developer's machine because of a version difference.
      - run: pip install "ruff>=0.16,<0.17"
      # Rule selection lives in ruff.toml, not in this command: `ruff check`
      # reads the committed config, so there is no second place to keep in sync.
      # No path argument, so the gate covers src/ and tests/ alike. Narrowing it
      # to src/ is exactly what would have missed the dead assertions in
      # tests/test_cache.py that this gate was added for.
      - name: Lint (pyflakes)
        run: ruff check .
      - name: Lint statistics
        if: always()
        run: ruff check . --select=F --statistics

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest jsonschema
      - run: python -m pytest tests/ -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build
      # A green build proves nothing about the sitemap: without site_url mkdocs
      # still succeeds and still writes sitemap.xml, as a valid but EMPTY
      # urlset. This is the only job where mkdocs is installed, so this is the
      # only place the real artifact can be checked.
      - run: python scripts/check_docs_sitemap.py --site-dir site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docs]
    runs-on: ubuntu-latest
    # GitHub allows a single in-flight Pages deployment per repository, and
    # actions/deploy-pages does not queue: a second concurrent create fails with
    # "due to in progress deployment ... or wait for it to complete". Merging a
    # batch of PRs lands several pushes on main within a minute, so without this
    # group whichever deployment arrives second fails even though its build and
    # tests are green. The group serializes them and cancel-in-progress drops the
    # superseded one instead of publishing a stale build.
    #
    # This belongs on the job, not the workflow: a workflow-level group would
    # also cancel the test matrix of a newer commit whenever an older commit
    # reaches this step.
    concurrency:
      group: pages-deploy-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4