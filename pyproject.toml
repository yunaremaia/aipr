[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipr-py"
version = "0.2.9"
description = "Read a repository's AI contribution policy before you (or your agent) contribute."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yunare Maia", email = "yunare@gmail.com" }]
keywords = [
    "ai-policy",
    "open-source",
    "contributing",
    "contribution-policy",
    "agents",
    "ai-agents",
    "policy",
    "cli",
    "developer-tools",
    "code-review",
    "github",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "regex>=2024.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "jsonschema>=4.0.0",
]

[project.scripts]
aipr = "aipr.cli:main"

[project.urls]
# `Homepage` and `Documentation` point at the GitHub Pages site built from
# docs/ by the `docs`/`deploy-docs` jobs in .github/workflows/ci.yml, not at the
# docs/ directory in this repository -- the directory is a source tree, not a
# site. `Homepage` takes the site root and `Documentation` deep-links the first
# guide, so the two labels do not advertise one URL twice; the repository is
# still linked under `Source`, `Issues` and `Changelog`.
#
# Until 0.2.8 `Homepage` was the repository URL, which PyPI already renders
# right next to it -- a link to the place the visitor had already arrived.
Homepage = "https://yunaremaia.github.io/aipr/"
Documentation = "https://yunaremaia.github.io/aipr/getting-started/"
Source = "https://github.com/yunaremaia/aipr"
Issues = "https://github.com/yunaremaia/aipr/issues"
Funding = "https://github.com/sponsors/yunaremaia"
Changelog = "https://github.com/yunaremaia/aipr/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
