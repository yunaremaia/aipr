[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipr-py"
version = "0.2.6"
description = "Read a repository's AI contribution policy before you (or your agent) contribute."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yunare Maia", email = "yunare@gmail.com" }]
keywords = [
    "ai-policy",
    "open-source",
    "contributing",
    "contribution-policy",
    "agents",
    "ai-agents",
    "policy",
    "cli",
    "developer-tools",
    "code-review",
    "github",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "regex>=2024.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "jsonschema>=4.0.0",
]

[project.scripts]
aipr = "aipr.cli:main"

[project.urls]
Homepage = "https://github.com/yunaremaia/aipr"
Source = "https://github.com/yunaremaia/aipr"
Issues = "https://github.com/yunaremaia/aipr/issues"
Funding = "https://github.com/sponsors/yunaremaia"
Changelog = "https://github.com/yunaremaia/aipr/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
